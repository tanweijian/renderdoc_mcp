name: Publish release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source archive
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive_name="renderdoc_mcp-${TAG_NAME//\//-}"
          git archive \
            --format=zip \
            --output="${archive_name}.zip" \
            "${TAG_NAME}"
          echo "ARCHIVE_NAME=${archive_name}" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${ARCHIVE_NAME}.zip" --clobber
          else
            gh release create "${TAG_NAME}" "${ARCHIVE_NAME}.zip" \
              --verify-tag \
              --generate-notes \
              --title "${TAG_NAME}"
          fi
